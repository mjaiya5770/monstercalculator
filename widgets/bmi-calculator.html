<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator — Monster Calculator</title>
<meta name="robots" content="noindex">
<script>if(/[?&]embed=1(&|$)/.test(window.location.search))document.documentElement.classList.add("nn-embed");</script>
<link rel="stylesheet" href="../assets/style.css">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="manifest" href="../assets/site.webmanifest">
<link rel="canonical" href="https://monstercalculator.org/tools/bmi-calculator.html">
</head>
<body>
<main class="wrap">
<div class="nn-embed-bar">🧮 <span>Free calculator from <a href="../tools/bmi-calculator.html" target="_blank" rel="noopener">Monster Calculator</a> — the BMI guide &amp; more tools live there.</span></div>
<div class="card nn-calc-card">
    <div class="row">
      <div class="field"><label for="units">Units</label><select id="units" onchange="toggleUnits(true)"><option value="imp">Imperial (ft / in / lbs)</option><option value="met">Metric (cm / kg)</option></select></div>
      <div class="field"><label>Mode</label><div class="nn-seg no-print" role="tablist" aria-label="BMI mode"><button type="button" id="bmiModeMine" class="active" onclick="setBmiMode('mine')">My BMI</button><button type="button" id="bmiModeTarget" onclick="setBmiMode('target')">Weight for a target BMI</button></div></div>
    </div>
    <div class="field" id="bmiTargetField" hidden><label for="targetBmi">Target BMI</label><input id="targetBmi" type="number" value="22" min="10" max="60" step="0.1"></div>
    <div id="impFields">
      <div class="row">
        <div class="field"><label for="ft">Height — feet</label><input id="ft" type="number" value="5" min="0"></div>
        <div class="field"><label for="inch">Height — inches</label><input id="inch" type="number" value="10" min="0" max="11"></div>
        <div class="field"><label for="lbs">Weight (lbs)</label><input id="lbs" type="number" value="180" min="0"></div>
      </div>
    </div>
    <div id="metFields" style="display:none">
      <div class="row">
        <div class="field"><label for="cm">Height (cm)</label><input id="cm" type="number" value="178" min="0"></div>
        <div class="field"><label for="kg">Weight (kg)</label><input id="kg" type="number" value="82" min="0"></div>
      </div>
    </div>
    <button class="btn" onclick="calc()">Calculate BMI</button>
    <div class="nn-actions no-print" data-nn-actions>
  <button type="button" class="nn-btn" data-nn="share">🔗 Copy link to this result</button>
  <button type="button" class="nn-btn" data-nn="copy">📋 Copy result</button>
  <button type="button" class="nn-btn" data-nn="save">💾 Save this calculation</button>
  <button type="button" class="nn-btn" data-nn="print">🖨️ Print / Save PDF</button>
</div>
<div class="nn-saves no-print" id="nnSavesPanel" hidden></div>
<p class="nn-embed-link no-print"><a href="../embed.html#bmi-calculator">Embed this calculator on your site — free</a></p>
<div class="results" id="results">
      <div style="color:var(--muted);font-size:.9rem">Your BMI</div>
      <div class="big" id="rBmi">0</div>
      <p class="verdict" id="verdict"></p>
      <table>
        <tr><td>Category</td><td id="rCat">—</td></tr>
        <tr><td>Healthy weight range for your height</td><td id="rRange">—</td></tr>
        <tr id="bmiTargetRow" hidden><td id="rTargetLab">Weight at your target BMI</td><td id="rTargetWeight">—</td></tr>
      </table>
    
<div class="nn-signature no-print" data-nn-signature hidden><div class="nn-sig-title">Where your BMI sits</div><div class="nn-sig-body"></div></div>
</div>
  </div>
</main>
<script>
/*P4PURE*/
function bmiMetric(kg,cm){var h=cm/100;return h>0?kg/(h*h):0;}
function bmiImperial(lbs,totalIn){return totalIn>0?703*lbs/(totalIn*totalIn):0;}
function bmiCategory(bmi){return bmi<18.5?'Underweight':bmi<25?'Healthy weight':bmi<30?'Overweight':'Obese';}
function weightForBmiMetric(target,cm){var h=cm/100;return target*h*h;}
function weightForBmiImperial(target,totalIn){return target*totalIn*totalIn/703;}
/*P4PURE-END*/
var UMAP={kg:'kg',cm:'cm',lb:'lbs',ft:'ft',inch:'inch'};
function convToImp_(){var cm=+document.getElementById(UMAP.cm).value||0,kg=+document.getElementById(UMAP.kg).value||0;var t=cm/2.54,ft=Math.floor(t/12),inch=Math.round((t-ft*12)*10)/10;if(inch>=12){ft+=1;inch=0;}document.getElementById(UMAP.ft).value=ft;document.getElementById(UMAP.inch).value=inch;document.getElementById(UMAP.lb).value=Math.round(kg/0.45359237*10)/10;}
function convToMet_(){var ft=+document.getElementById(UMAP.ft).value||0,inch=+document.getElementById(UMAP.inch).value||0,lb=+document.getElementById(UMAP.lb).value||0;document.getElementById(UMAP.cm).value=Math.round((ft*12+inch)*2.54*10)/10;document.getElementById(UMAP.kg).value=Math.round(lb*0.45359237*10)/10;}
var bmiUnitsPrev='imp',bmiMode='mine';
function toggleUnits(conv){
  var met=document.getElementById('units').value==='met';
  var cur=met?'met':'imp';
  if(conv&&bmiUnitsPrev!==cur){if(met)convToMet_();else convToImp_();}
  bmiUnitsPrev=cur;
  try{localStorage.setItem('nnBmiUnits',cur);}catch(e){}
  document.getElementById('impFields').style.display=met?'none':'block';
  document.getElementById('metFields').style.display=met?'block':'none';
  if(conv)calc();
}
function setBmiMode(m){
  bmiMode=m;
  document.getElementById('bmiModeMine').classList.toggle('active',m==='mine');
  document.getElementById('bmiModeTarget').classList.toggle('active',m==='target');
  document.getElementById('bmiTargetField').hidden=m!=='target';
  document.getElementById('bmiTargetRow').hidden=m!=='target';
  calc();
}
function calc(){
  var met=document.getElementById('units').value==='met';
  var bmi,rangeTxt,unit;
  if(met){
    var cm=+document.getElementById('cm').value||0,kg=+document.getElementById('kg').value||0;
    bmi=bmiMetric(kg,cm);
    var lo=18.5*(cm/100)*(cm/100),hi=24.9*(cm/100)*(cm/100);
    rangeTxt=lo.toFixed(1)+' – '+hi.toFixed(1)+' kg'; unit='kg';
    var tw=weightForBmiMetric(+document.getElementById('targetBmi').value||0,cm);
  }else{
    var ti=(+document.getElementById('ft').value||0)*12+(+document.getElementById('inch').value||0),lbs=+document.getElementById('lbs').value||0;
    bmi=bmiImperial(lbs,ti);
    var lo=18.5*ti*ti/703,hi=24.9*ti*ti/703;
    rangeTxt=lo.toFixed(1)+' – '+hi.toFixed(1)+' lbs'; unit='lbs';
    var tw=weightForBmiImperial(+document.getElementById('targetBmi').value||0,ti);
  }
  var cat=bmiCategory(bmi);
  document.getElementById('rBmi').textContent=bmi.toFixed(1);
  document.getElementById('rCat').textContent=cat;
  document.getElementById('rRange').textContent=rangeTxt;
  var tb=+document.getElementById('targetBmi').value||0;
  document.getElementById('rTargetLab').textContent='Weight at BMI '+tb;
  document.getElementById('rTargetWeight').textContent=tw>0?tw.toFixed(1)+' '+unit:'—';
  var bandTxt=cat==='Underweight'?'below 18.5':cat==='Healthy weight'?'18.5–24.9':cat==='Overweight'?'25–29.9':'30 and above';
  document.getElementById('verdict').textContent='Your BMI of '+bmi.toFixed(1)+' sits in the '+cat+' band ('+bandTxt+'). For your height, the healthy band (18.5–24.9) is '+rangeTxt+'. BMI is a screening measure, not a diagnosis.';
  document.getElementById('results').classList.add('show');
  sigSet('Where your BMI sits', sigRulerHTML(14,40,[[18.5,'Under 18.5'],[25,'18.5–24.9'],[30,'25–29.9'],[40,'30 +']],bmi,bmi.toFixed(1),'Bands: CDC adult cutoffs — under 18.5 underweight, 18.5–24.9 healthy, 25–29.9 overweight, 30+ obese.'));
}
try{var __su=localStorage.getItem('nnBmiUnits');if(__su){document.getElementById('units').value=__su;bmiUnitsPrev=__su;}}catch(e){}
document.querySelectorAll('.nn-calc-card input,.nn-calc-card select').forEach(function(el){el.addEventListener('input',calc);el.addEventListener('change',calc);});
toggleUnits();calc();

/*P4SIG*/
function sigSlotBody(){var s=document.querySelector('[data-nn-signature]');return s?s.querySelector('.nn-sig-body'):null;}
function sigSet(title,html){var b=sigSlotBody();if(!b)return;b.innerHTML=(title?'<p class="sig-title">'+title+'</p>':'')+html;}
function sigMoney(v){return (v<0?'-$':'$')+Math.abs(Math.round(v)).toLocaleString('en-US');}
var fmt0=(typeof fmt0==='function')?fmt0:function(n){return n.toLocaleString('en-US',{maximumFractionDigits:0});};
var fmt1=(typeof fmt1==='function')?fmt1:function(n){return n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});};
var money=(typeof money==='function')?money:function(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
var money0=(typeof money0==='function')?money0:function(n){return '$'+Math.round(n).toLocaleString('en-US');};

function sigRulerHTML(min,max,bands,value,valueLabel,note){
  if(!(max>min))return '';
  var span=max-min;
  var cells=bands.map(function(b,i){
    var from=i===0?min:bands[i-1][0], to=b[0];
    var w=Math.max(0,Math.min(100,(to-from)/span*100));
    return '<span class="sig-ruler-band s-'+String.fromCharCode(97+(i%5))+'" style="width:'+w.toFixed(2)+'%"><span class="sig-ruler-lab">'+b[1]+'</span></span>';
  }).join('');
  var pos=Math.max(0,Math.min(100,(value-min)/span*100));
  return '<div class="sig-ruler" role="img" aria-label="'+valueLabel+'"><div class="sig-ruler-track">'+cells+'<span class="sig-ruler-mark" style="left:'+pos.toFixed(2)+'%"></span></div><div class="sig-ruler-val" style="left:'+pos.toFixed(2)+'%">'+valueLabel+'</div></div>'+(note?'<div class="sig-note">'+note+'</div>':'');
}
/*P4RULER-END*/</script>
<script src="../assets/ads.js"></script>
<script src="../assets/track.js"></script>
<script src="../assets/nn-tools.js"></script>
</body>
</html>
